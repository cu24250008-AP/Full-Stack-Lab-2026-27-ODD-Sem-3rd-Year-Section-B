<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZZY | Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">CRAZZY</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#about">About</a>
        <a href="cart.html">Cart 🛍</a>
    </nav>
</header>


<main>

<section class="checkout-section">

    <div class="checkout-box">

        <p class="small-title center">CRAZZY CHECKOUT</p>

        <h1>Complete Your Order</h1>

        <p class="checkout-subtitle">
            Enter your details below to complete your purchase.
        </p>


        <form>

            <div class="form-group">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label for="address">Address</label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your complete address"
                    required></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="city">City</label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter city"
                        required>

                </div>


                <div class="form-group">

                    <label for="pincode">Pincode</label>

                    <input
                        type="text"
                        id="pincode"
                        name="pincode"
                        placeholder="Enter pincode"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    required>

            </div>


            <div class="form-group">

                <label>Payment Method</label>

                <div class="payment-options">

                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="cod"
                            required>
                        Cash on Delivery
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="upi">
                        UPI
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="card">
                        Credit / Debit Card
                    </label>

                </div>

            </div>


            <button type="submit" class="dark-btn order-btn">
                PLACE ORDER
            </button>

        </form>

    </div>

</section>

</main>


<footer>
    <div class="footer-logo">CRAZZY</div>
    <p>Timeless fashion for your everyday story.</p>
    <p>Email: hello@crazzy.com | Phone: +91 98765 XXXXX</p>
</footer>

</body>
</html>
