<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CRAZZY | Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">CRAZZY</div>

    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Shop</a>

        <a href="index.html#categories">Categories</a>

        <a href="index.html#about">About</a>

        <a href="cart.html">
            Cart 🛍 <span class="cart-count">0</span>
        </a>

    </nav>

</header>


<section class="checkout-section">


    <div class="checkout-box">


        <p class="small-title center">
            CRAZZY CHECKOUT
        </p>


        <h1>Complete Your Order</h1>


        <p class="checkout-subtitle">
            Enter your details below to complete your purchase.
        </p>


        <form id="checkout-form">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name">

                <span
                    id="name-error"
                    class="error-message">
                </span>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    rows="4"
                    placeholder="Enter your complete address"></textarea>

                <span
                    id="address-error"
                    class="error-message">
                </span>

            </div>


            <!-- CITY -->

            <div class="form-row">

                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city">

                </div>


                <!-- PINCODE -->

                <div class="form-group">

                    <label for="pincode">
                        Pincode
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        maxlength="6"
                        placeholder="6 digit pincode">

                    <span
                        id="pincode-error"
                        class="error-message">
                    </span>

                </div>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    maxlength="10"
                    placeholder="10 digit phone number">

                <span
                    id="phone-error"
                    class="error-message">
                </span>

            </div>


            <!-- PAYMENT -->

            <div class="form-group">

                <label>
                    Payment Method
                </label>


                <div class="payment-options">

                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="cod">
                        Cash on Delivery
                    </label>


                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="upi">
                        UPI
                    </label>


                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="card">
                        Credit / Debit Card
                    </label>

                </div>


                <span
                    id="payment-error"
                    class="error-message">
                </span>

            </div>


            <button
                type="submit"
                class="dark-btn order-btn">

                PLACE ORDER

            </button>


            <div
                id="confirmation"
                class="confirmation-message">
            </div>


        </form>


    </div>


</section>


<footer>

    <div class="footer-logo">CRAZZY</div>

    <p>Timeless fashion for your everyday story.</p>

    <p>
        Email: hello@crazzy.com |
        Phone: +91 98765 XXXXX
    </p>

    <p>© 2026 CRAZZY. All Rights Reserved.</p>

</footer>


<script src="script.js"></script>

</body>
</html>
